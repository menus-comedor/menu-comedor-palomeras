# Avisos por Telegram:
#   - domingo por la tarde: el menú de toda la semana
#   - de lunes a jueves por la tarde: lo que comen mañana y qué evitar en la cena
#
# Las ejecuciones programadas aparecen a nombre de quien modificó este fichero por última vez.
# Usa una cuenta dedicada (aquí, menus-comedor-bot) si no quieres que aparezca tu usuario.
name: Avisos por Telegram

on:
  schedule:
    # 16:23 UTC (18:23 en Madrid en verano, 17:23 en invierno), de domingo a jueves.
    # Evitamos las horas en punto: GitHub va más cargado y puede retrasar o saltarse ejecuciones.
    - cron: "23 16 * * 0-4"
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué aviso enviar"
        type: choice
        default: auto
        options: [auto, semana, manana, hoy]
      fecha:
        description: "Hacer como si hoy fuera esta fecha (AAAA-MM-DD). Vacío = hoy"
        required: false
        default: ""

permissions:
  contents: read # este workflow solo lee el repositorio

jobs:
  avisar:
    runs-on: ubuntu-latest
    env:
      MENU_AVISOS: ${{ vars.MENU_AVISOS }}
      URL_WEB: ${{ vars.URL_WEB || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Enviar el aviso
        run: python -m comedor avisar "$MODO" ${FECHA:+--fecha "$FECHA"}
        env: # los secretos solo llegan a este paso
          MODO: ${{ inputs.modo || 'auto' }}
          FECHA: ${{ inputs.fecha }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
